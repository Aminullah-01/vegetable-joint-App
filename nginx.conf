# ==============================================================================
# Vegetable Joint — Production Nginx Static & CDN Reverse Proxy Configuration
# SRS References: Source §43 (Separate Frontend Deployment), NFR-SEC-06, NFR-SEC-10
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name vegetablejoint.ng www.vegetablejoint.ng;

    # Redirect all HTTP requests to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vegetablejoint.ng www.vegetablejoint.ng;

    root /usr/share/nginx/html;
    index index.html;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers (Source §43, NFR-SEC-06, NFR-SEC-10)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://api.vegetablejoint.ng https://staging-api.vegetablejoint.ng http://localhost:8000; frame-ancestors 'self';" always;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Content-hashed static assets: cached for 1 year (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon and robots
    location = /favicon.svg {
        expires 1w;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Entrypoint (index.html): must never be cached aggressively
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA routing fallback: send all non-file URI requests to index.html (Source §43)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
